name: Build and Release Focus

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        python -m pip install --upgrade pip
        pip install cmake setuptools wheel
        pip install -r requirements.txt

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        python -m pip install --upgrade pip
        pip install cmake setuptools wheel
        pip install -r requirements.txt

    - name: Build executable with PyInstaller
      run: |
        python build.py

    - name: Zip build artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path dist/Focus.exe -DestinationPath Focus-Windows.zip

    - name: Zip build artifact (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -ry ../Focus-macOS.zip Focus.app Uruchom_Focus.command

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Focus-${{ matrix.os }}
        path: |
          Focus-Windows.zip
          Focus-macOS.zip
        if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all workflow run artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          artifacts/**/*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
